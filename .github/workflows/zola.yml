name: Build and deploy on push
on: push

jobs:
  build:
    name: shalzz/zola-deploy-action
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: shalzz/zola-deploy-action
      uses: shalzz/zola-deploy-action@v0.23.4
      env:
        PAGES_BRANCH: gh-pages
        BUILD_DIR: .
        BUILD_FLAGS: --drafts
        TOKEN: ${{ secrets.GH_TOKEN }}